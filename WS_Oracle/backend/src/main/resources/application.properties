spring.config.import=optional:file:.env[.properties]

spring.application.name=fiduciawebmovil

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# Puerto HTTPS principal
server.port=${PORT}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# Archivo src/main/resources/application.properties
#server.port=8443
# Puerto HTTP adicional (para redirección o uso simultáneo)
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=Leonardin8$
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=fw_local

# Pool de conexiones HikariCP (Recomendado)
spring.datasource.hikari.maximum-pool-size=20
# MySQL Database Connection
#spring.datasource.url=${PROD_DB_URL}
#spring.datasource.username=${PROD_DB_USERNAME}
#spring.datasource.password=${PROD_DB_PASSWORD}


# PostgreSQL Database Connection
spring.datasource.url=${LOCAL_DB_URL}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}


# JPA/Hibernate
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



# JWT Configuration
jwt.secret.string=${JWT_SECRET}
jwt.expiration.time=${JWT_EXPIRATION_TIME}



## Mail configuration
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.host=smtp.hostinger.com
spring.mail.port=465


# Enable TLS SMTP Mail
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Configuración específica para puerto 465 (SSL)
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

password.reset.link=http://localhost:3000/reset-password?code=



#AWS S3 CONFIG
aws.accessKeyId=${AWS_ACCESS_KEY}
aws.secretAccessKey=${AWS_SECRETE_KEY}
aws.region=us-east-2
aws.s3.bucketName=${AWS_BUCKET_NAME}

# Configuración de subida de archivos
#file.upload-dir=./uploads/pdf/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ruta parametrizable para almacenamiento de PDFs
file.upload-dir=C:/Documentos/pdf/upload

# Ruta parametrizable para almacenamiento de PDFs Contrato
file.upload-dir2=C:/Documentos/pdf/contrato















spring.config.import=optional:file:.env[.properties]

spring.application.name=fiduciawebmovil

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# Puerto HTTPS principal
server.port=${PORT:-8091}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexiones HikariCP (Recomendado)
spring.datasource.hikari.maximum-pool-size=20

# PostgreSQL Database Connection
spring.datasource.url=${LOCAL_DB_URL:-jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${LOCAL_DB_USERNAME:-hsbc}
spring.datasource.password=${LOCAL_DB_PASSWORD:-ghrDevel0918$}

# JPA/Hibernate
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

## JWT Configuration
jwt.secret.string=${JWT_SECRET:-dennis123456789phegon123456789den1234321}
jwt.expiration.time=${JWT_EXPIRATION_TIME:-2592000000}



## Mail configuration
spring.mail.username=${MAIL_USER:-ventas@trustechcapitalmexico.com}
spring.mail.password=${MAIL_PASS:-Leonardin7$}
spring.mail.host=${MAIL_SERVER:-smtp.hostinger.com$}
spring.mail.port=${MAIL_SERVER_PORT:-465}


# Enable TLS SMTP Mail
spring.mail.protocol=${MAIL_SERVER_PROTOCOL:-smtp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Configuración específica para puerto 465 (SSL)
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_SERVER_PORT:-465}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory


<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notificación de Solicitud</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f6f9fc; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #ffffff;
                     border-radius: 8px; padding: 25px;
                     box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #1565c0; }
        p { color: #333; }
        .footer { margin-top: 30px; font-size: 13px; color: #555; }
    </style>
</head>
<body>
<div class="container">
    <h2>Código de Autenticación - Operación Segura</h2>
    <p>Por este conducto, se informa al usuario <span th:text="${name}"></span>.</p>
    <p>Tu código OTP para autenticar la operación es: "</p>
    <p><span th:text="${otp}"></span></p>
    <p>Este código expira en 5 minutos.</p>
</div>
</body>
</html>
